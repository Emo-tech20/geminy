<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMOVA AI - Your Intelligent Assistant</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Prevent theme flash on page load -->
    <script src="/js/theme-init.js"></script>
</head>
<body>
    <div id="app"></div>

    <!-- Landing Page -->
    <template id="landing-template">
        <div class="landing-container">
            <nav class="landing-nav">
                <div class="logo">
                    <img src="/images/emova-logo.svg" alt="EMOVA AI Logo" class="logo-img">
                    <span>EMOVA AI</span>
                </div>
                <div class="nav-links">
                    <button id="theme-toggle-landing" class="theme-toggle" aria-label="Toggle theme">
                        <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                        <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                </div>
            </nav>

            <div class="landing-hero">
                <div class="hero-content">
                    <h1>Your AI Assistant, Elevated</h1>
                    <p class="hero-subtitle">Meet EMOVA AI</p>
                    <p class="hero-description">Intelligent conversations powered by Google Gemini. Get instant answers, explore ideas, and unlock your potential with cutting-edge AI technology.</p>

                    <div class="hero-buttons">
                        <button class="btn btn-primary" data-action="show-signup">Get Started</button>
                        <button class="btn btn-secondary" data-action="show-signin">Sign In</button>
                    </div>

                    <div class="hero-features">
                        <div class="feature-item">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/><path d="M10 17l5-5-5-5"/>
                            </svg>
                            <span>Instant Responses</span>
                        </div>
                        <div class="feature-item">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16v16H4z"/><path d="M4 10h16M10 4v16"/>
                            </svg>
                            <span>Context Aware</span>
                        </div>
                        <div class="feature-item">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                            <span>Always Secure</span>
                        </div>
                    </div>
                </div>
                <div class="hero-image">
                    <img src="/images/emova-logo-lockup.svg" alt="EMOVA AI" class="hero-logo">
                </div>
            </div>

            <footer class="landing-footer">
                <p>&copy; 2024 EMOVA AI. Powered by Google Gemini.</p>
            </footer>
        </div>
    </template>

    <!-- Sign Up Page -->
    <template id="signup-template">
        <div class="auth-container">
            <button class="back-btn" data-action="show-landing" aria-label="Go back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </button>

            <div class="auth-card">
                <div class="auth-header">
                    <div class="logo">
                        <img src="/images/emova-logo.svg" alt="EMOVA AI Logo" class="auth-logo-img">
                    </div>
                    <h1>Create Account</h1>
                    <p>Join EMOVA AI to get started</p>
                </div>

                <form id="signup-form" class="auth-form">
                    <div class="form-error" id="signup-error" style="display: none;"></div>

                    <div class="form-group">
                        <label for="signup-fullname">Full Name</label>
                        <input
                            type="text"
                            id="signup-fullname"
                            name="fullName"
                            placeholder="John Doe"
                            required
                            autocomplete="name"
                        >
                        <span class="field-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="signup-email">Email</label>
                        <input
                            type="text"
                            id="signup-email"
                            name="email"
                            placeholder="you@example.com"
                            required
                            autocomplete="email"
                        >
                        <span class="field-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="signup-password">Password</label>
                        <div class="password-input-wrapper">
                            <input
                                type="password"
                                id="signup-password"
                                name="password"
                                placeholder="At least 8 characters"
                                required
                                autocomplete="new-password"
                            >
                            <button type="button" class="password-toggle" data-target="signup-password" aria-label="Toggle password visibility">
                                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                        <div class="password-hint">
                            <small>Must be at least 8 characters long</small>
                        </div>
                        <span class="field-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="signup-confirm">Confirm Password</label>
                        <div class="password-input-wrapper">
                            <input
                                type="password"
                                id="signup-confirm"
                                name="confirmPassword"
                                placeholder="Confirm your password"
                                required
                                autocomplete="new-password"
                            >
                            <button type="button" class="password-toggle" data-target="signup-confirm" aria-label="Toggle password visibility">
                                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                        <span class="field-error"></span>
                    </div>

                    <div class="form-group checkbox">
                        <input
                            type="checkbox"
                            id="signup-terms"
                            name="terms"
                            required
                        >
                        <label for="signup-terms">I agree to the Terms and Privacy Policy</label>
                        <span class="field-error"></span>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        <span class="btn-text">Create Account</span>
                        <span class="btn-loader" style="display: none;">
                            <span class="loader"></span>
                        </span>
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Already have an account? <button data-action="show-signin" class="link-btn">Sign in here</button></p>
                </div>

                <div class="theme-toggle-footer">
                    <button id="theme-toggle-auth" class="theme-toggle" aria-label="Toggle theme">
                        <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                        <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </template>

    <!-- Sign In Page -->
    <template id="signin-template">
        <div class="auth-container">
            <button class="back-btn" data-action="show-landing" aria-label="Go back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </button>

            <div class="auth-card">
                <div class="auth-header">
                    <div class="logo">
                        <img src="/images/emova-logo.svg" alt="EMOVA AI Logo" class="auth-logo-img">
                    </div>
                    <h1>Welcome Back</h1>
                    <p>Sign in to your EMOVA AI account</p>
                </div>

                <form id="signin-form" class="auth-form">
                    <div class="form-error" id="signin-error" style="display: none;"></div>

                    <div class="form-group">
                        <label for="signin-email">Email</label>
                        <input
                            type="text"
                            id="signin-email"
                            name="email"
                            placeholder="you@example.com"
                            required
                            autocomplete="email"
                        >
                        <span class="field-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="signin-password">Password</label>
                        <div class="password-input-wrapper">
                            <input
                                type="password"
                                id="signin-password"
                                name="password"
                                placeholder="Your password"
                                required
                                autocomplete="current-password"
                            >
                            <button type="button" class="password-toggle" data-target="signin-password" aria-label="Toggle password visibility">
                                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                        <span class="field-error"></span>
                    </div>

                    <div class="forgot-password-link">
                        <button type="button" data-action="show-forgot-password" class="link-btn">Forgot password?</button>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        <span class="btn-text">Sign In</span>
                        <span class="btn-loader" style="display: none;">
                            <span class="loader"></span>
                        </span>
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Don't have an account? <button data-action="show-signup" class="link-btn">Sign up here</button></p>
                </div>

                <div class="theme-toggle-footer">
                    <button id="theme-toggle-auth" class="theme-toggle" aria-label="Toggle theme">
                        <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                        <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </template>

    <!-- Forgot Password Page -->
    <template id="forgot-password-template">
        <div class="auth-container">
            <button class="back-btn" data-action="show-signin" aria-label="Go back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </button>

            <div class="auth-card">
                <div class="auth-header">
                    <div class="logo">
                        <img src="/images/emova-logo.svg" alt="EMOVA AI Logo" class="auth-logo-img">
                    </div>
                    <h1>Reset Password</h1>
                    <p>Enter your email to receive a password reset link</p>
                </div>

                <form id="forgot-password-form" class="auth-form">
                    <div class="form-success" id="forgot-password-success" style="display: none;"></div>
                    <div class="form-error" id="forgot-password-error" style="display: none;"></div>

                    <div class="form-group">
                        <label for="forgot-email">Email</label>
                        <input
                            type="text"
                            id="forgot-email"
                            name="email"
                            placeholder="you@example.com"
                            required
                            autocomplete="email"
                        >
                        <span class="field-error"></span>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        <span class="btn-text">Send Reset Link</span>
                        <span class="btn-loader" style="display: none;">
                            <span class="loader"></span>
                        </span>
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Remember your password? <button data-action="show-signin" class="link-btn">Back to sign in</button></p>
                </div>

                <div class="theme-toggle-footer">
                    <button id="theme-toggle-auth" class="theme-toggle" aria-label="Toggle theme">
                        <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                        <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </template>

    <!-- Chat Page -->
    <template id="chat-template">
        <div class="chat-container">
            <aside class="chat-sidebar">
                <div class="sidebar-header">
                    <div class="logo">
                        <img src="/images/emova-logo.svg" alt="EMOVA AI Logo" class="sidebar-logo-img">
                        <span>EMOVA AI</span>
                    </div>
                    <button class="sidebar-close" aria-label="Close sidebar">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>

                <button class="new-chat-btn" data-action="create-new-chat">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    New Chat
                </button>

                <button class="settings-nav-button" data-action="show-settings" aria-current="false">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.7 2.94-.08-.02a1.7 1.7 0 0 0-1.75.64l-.05.07h-3.4l-.05-.07a1.7 1.7 0 0 0-1.75-.64l-.08.02-1.7-2.94.06-.06A1.7 1.7 0 0 0 9.6 15l-.08-.03v-3.4l.08-.03a1.7 1.7 0 0 0-.34-1.88l-.06-.06 1.7-2.94.08.02a1.7 1.7 0 0 0 1.75-.64l.05-.07h3.4l.05.07a1.7 1.7 0 0 0 1.75.64l.08-.02 1.7 2.94-.06.06A1.7 1.7 0 0 0 19.4 12l.08.03v3.4z" transform="translate(-2 -2)"/>
                    </svg>
                    <span>Settings</span>
                </button>

                <div class="conversations-list">
                    <div class="conversations-empty" style="display: none;">
                        <p>No conversations yet</p>
                    </div>
                    <div class="conversations-loading" style="display: none;">
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                        <div class="skeleton"></div>
                    </div>
                </div>

                <div class="sidebar-footer">
                    <button class="account-menu-toggle" data-action="toggle-account-menu" aria-label="Account menu">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <span class="user-email"></span>
                    </button>

                    <div class="account-menu" style="display: none;">
                        <button data-action="show-settings">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <circle cx="12" cy="12" r="3"/>
                                <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.7 2.94-.08-.02a1.7 1.7 0 0 0-1.75.64l-.05.07h-3.4l-.05-.07a1.7 1.7 0 0 0-1.75-.64l-.08.02-1.7-2.94.06-.06A1.7 1.7 0 0 0 9.6 15l-.08-.03v-3.4l.08-.03a1.7 1.7 0 0 0-.34-1.88l-.06-.06 1.7-2.94.08.02a1.7 1.7 0 0 0 1.75-.64l.05-.07h3.4l.05.07a1.7 1.7 0 0 0 1.75.64l.08-.02 1.7 2.94-.06.06A1.7 1.7 0 0 0 19.4 12l.08.03v3.4z" transform="translate(-2 -2)"/>
                            </svg>
                            Settings & profile
                        </button>
                        <button class="theme-toggle-chat" aria-label="Toggle theme">
                            <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                            </svg>
                            <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                            </svg>
                            <span>Toggle Theme</span>
                        </button>
                        <button class="sign-out-btn" data-action="sign-out">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
                            </svg>
                            Sign Out
                        </button>
                    </div>
                </div>
            </aside>

            <main class="chat-main">
                <header class="chat-heading-bar chat-toolbar">
                    <h1>Chat</h1>
                </header>
                <div class="chat-model-toolbar">
                    <label for="model-selector">AI model</label>
                    <select id="model-selector" class="model-selector" aria-describedby="model-status">
                        <option value="">Loading available models…</option>
                    </select>
                    <span class="active-model-label" aria-live="polite">Choose a model to start</span>
                    <span id="model-status" class="model-status" role="status"></span>
                </div>
                <div class="messages-container">
                    <div class="messages-empty">
                        <h2>Start a New Conversation</h2>
                        <p>Ask me anything and I'll do my best to help</p>
                        <div class="suggested-prompts">
                            <button class="suggested-prompt" data-action="insert-prompt" data-prompt="Explain quantum computing in simple terms">
                                Explain quantum computing in simple terms
                            </button>
                            <button class="suggested-prompt" data-action="insert-prompt" data-prompt="What are the best productivity tips?">
                                What are the best productivity tips?
                            </button>
                            <button class="suggested-prompt" data-action="insert-prompt" data-prompt="How do I learn a new programming language?">
                                How do I learn a new programming language?
                            </button>
                        </div>
                    </div>
                    <div class="messages-list"></div>
                </div>

                <div class="chat-composer">
                    <div class="chat-status" role="status" aria-live="polite" hidden></div>
                    <form class="composer-form" data-action="send-message">
                        <textarea
                            class="composer-input"
                            placeholder="Ask me anything..."
                            rows="1"
                            aria-label="Message input"
                        ></textarea>
                        <button type="button" class="composer-button image-gen-button" data-action="show-image-prompt" aria-label="Generate image" title="Generate image">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
                            </svg>
                        </button>
                        <button type="button" class="composer-button voice-input-button" data-voice-action="record" aria-label="Start voice input" title="Start voice input">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <rect x="9" y="2" width="6" height="12" rx="3"></rect>
                                <path d="M5 10a7 7 0 0 0 14 0M12 17v5m-4 0h8"></path>
                            </svg>
                        </button>
                        <button type="button" class="composer-cancel voice-cancel-button" data-voice-action="cancel-recording" aria-label="Cancel voice recording" hidden>
                            Cancel
                        </button>
                        <button type="button" class="composer-cancel" data-chat-action="stop-response" aria-label="Stop response" title="Stop response" hidden>
                            Stop
                        </button>
                        <button type="submit" class="composer-button" aria-label="Send message">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M16.6915026,12.4744748 L3.50612381,13.2599618 C3.19218622,13.2599618 3.03521743,13.4170592 3.03521743,13.5741566 L1.15159189,20.0151496 C0.8376543,20.8006365 0.99,21.89 1.77946707,22.52 C2.40214477,22.99 3.50612381,23.1 4.13399899,22.8429026 L21.714504,14.0454487 C22.6563168,13.5741566 23.1272231,12.6315722 22.9702544,11.6889879 C22.9702544,11.6889879 22.9702544,11.6889879 22.9702544,11.6889879 L4.13399899,1.16151313 C3.34915502,0.9 2.40214477,0.9 1.77946707,1.4429026 C0.994623095,2.0742751 0.837654326,3.33948917 1.15159189,4.12498602 L3.03521743,10.5659791 C3.03521743,10.7230765 3.19218622,10.8801738 3.50612381,10.8801738 L16.6915026,11.5115463 C16.6915026,11.5115463 17.1624089,11.5115463 17.1624089,12.0064027 C17.1624089,12.5012591 17.1624089,12.4744748 16.6915026,12.4744748 Z"/>
                            </svg>
                        </button>
                    </form>
                    <p class="composer-hint">Enter to send, Shift+Enter for new line</p>
                    <p class="voice-status" role="status" aria-live="polite"></p>
                </div>
            </main>

            <!-- Mobile sidebar toggle -->
            <button class="sidebar-toggle" data-action="toggle-sidebar" aria-label="Toggle sidebar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
        </div>
    </template>

    <template id="settings-template">
        <main class="settings-page">
            <header class="settings-topbar">
                <div class="settings-brand">
                    <img src="/images/emova-logo.svg" alt="" class="settings-brand-logo">
                    <span>EMOVA AI</span>
                </div>
                <span class="settings-current-nav" aria-current="page">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15l.1.1-1.6 2.8-.2-.1a1.8 1.8 0 0 0-1.8.7l-.1.2h-3.3l-.1-.2a1.8 1.8 0 0 0-1.8-.7l-.2.1-1.6-2.8.1-.1a1.8 1.8 0 0 0 .4-1.9l-.2-.1v-3.2l.2-.1a1.8 1.8 0 0 0-.4-1.9l-.1-.1 1.6-2.8.2.1a1.8 1.8 0 0 0 1.8-.7l.1-.2h3.3l.1.2a1.8 1.8 0 0 0 1.8.7l.2-.1 1.6 2.8-.1.1a1.8 1.8 0 0 0-.4 1.9l.2.1V13l-.2.1a1.8 1.8 0 0 0 .4 1.9z"/>
                    </svg>
                    <span>Settings</span>
                </span>
                <button class="btn btn-secondary settings-back-button" data-action="show-chat">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    Back to chat
                </button>
            </header>

            <section class="settings-content">
                <div class="settings-heading">
                    <p class="settings-eyebrow">YOUR ACCOUNT</p>
                    <h1>Settings</h1>
                    <p>Manage your profile, security, and appearance.</p>
                </div>
                <div id="settings-page-status" class="settings-notice" role="status" aria-live="polite" hidden></div>

                <section class="settings-card" aria-labelledby="profile-heading">
                    <div class="settings-card-heading">
                        <div>
                            <h2 id="profile-heading">Profile</h2>
                            <p>Your public identity across EMOVA AI.</p>
                        </div>
                    </div>
                    <form id="profile-settings-form">
                        <div class="profile-avatar-row">
                            <img id="profile-avatar-preview" class="profile-avatar" src="/images/emova-logo.svg" alt="Profile picture preview">
                            <div>
                                <strong>Profile picture</strong>
                                <p>JPEG, PNG, or WebP · up to 5 MB</p>
                                <div class="profile-avatar-actions">
                                    <label class="btn btn-secondary avatar-upload-label" for="profile-avatar-file">Choose image</label>
                                    <input id="profile-avatar-file" class="visually-hidden" type="file" accept="image/jpeg,image/png,image/webp">
                                    <button type="button" class="link-btn" data-action="remove-profile-avatar">Remove</button>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="profile-display-name">Display name</label>
                            <input id="profile-display-name" name="displayName" type="text" maxlength="80" autocomplete="name" required>
                        </div>
                        <div class="settings-profile-meta">
                            <div>
                                <span class="settings-field-label">Email</span>
                                <span id="profile-current-email">Loading…</span>
                            </div>
                            <div>
                                <span class="settings-field-label">Member since</span>
                                <span id="profile-created-at">—</span>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary settings-submit">Save profile</button>
                    </form>
                    <div id="profile-settings-message" class="settings-inline-message" role="status" aria-live="polite"></div>
                </section>

                <section class="settings-card" aria-labelledby="email-heading">
                    <div class="settings-card-heading">
                        <div>
                            <h2 id="email-heading">Email address</h2>
                            <p>Changes take effect after verification.</p>
                        </div>
                    </div>
                    <form id="email-settings-form">
                        <div class="form-group">
                            <label for="email-current">Current email</label>
                            <input id="email-current" type="email" readonly>
                        </div>
                        <div class="form-group">
                            <label for="email-new">New email</label>
                            <input id="email-new" name="email" type="email" autocomplete="email" required>
                        </div>
                        <button type="submit" class="btn btn-secondary settings-submit">Send verification email</button>
                    </form>
                    <div id="email-settings-message" class="settings-inline-message" role="status" aria-live="polite"></div>
                </section>

                <section class="settings-card" aria-labelledby="password-heading">
                    <div class="settings-card-heading">
                        <div>
                            <h2 id="password-heading">Password & security</h2>
                            <p>Keep your account protected with a strong password.</p>
                        </div>
                    </div>
                    <form id="password-settings-form">
                        <div class="form-group">
                            <label for="password-new">New password</label>
                            <input id="password-new" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
                        </div>
                        <div class="form-group">
                            <label for="password-confirm">Confirm new password</label>
                            <input id="password-confirm" name="confirmPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
                        </div>
                        <div class="settings-button-row">
                            <button type="submit" class="btn btn-primary">Update password</button>
                            <button type="button" class="btn btn-secondary" data-action="request-password-reset">Email me a reset link</button>
                        </div>
                    </form>
                    <div id="password-settings-message" class="settings-inline-message" role="status" aria-live="polite"></div>
                </section>

                <section class="settings-card" aria-labelledby="appearance-heading">
                    <div class="settings-card-heading">
                        <div>
                            <h2 id="appearance-heading">Appearance</h2>
                            <p>Choose the theme used across this device.</p>
                        </div>
                    </div>
                    <div class="settings-theme-options" role="group" aria-label="Color theme">
                        <button type="button" class="settings-theme-option" data-action="set-theme" data-theme-value="dark">
                            <span class="theme-preview theme-preview-dark" aria-hidden="true"></span>
                            <span>Dark</span>
                        </button>
                        <button type="button" class="settings-theme-option" data-action="set-theme" data-theme-value="light">
                            <span class="theme-preview theme-preview-light" aria-hidden="true"></span>
                            <span>Light</span>
                        </button>
                    </div>
                    <div id="appearance-settings-message" class="settings-inline-message" role="status" aria-live="polite"></div>
                </section>

                <section class="settings-card settings-danger-card" aria-labelledby="session-heading">
                    <div class="settings-card-heading">
                        <div>
                            <h2 id="session-heading">Session</h2>
                            <p>Sign out of EMOVA AI on this device.</p>
                        </div>
                    </div>
                    <button type="button" class="btn btn-secondary settings-signout" data-action="sign-out">Sign out</button>
                </section>
            </section>
        </main>
    </template>

    <template id="reset-password-template">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="logo"><img src="/images/emova-logo.svg" alt="EMOVA AI Logo" class="auth-logo-img"></div>
                    <h1>Choose a new password</h1>
                    <p>Use at least 8 characters.</p>
                </div>
                <form id="reset-password-form" class="auth-form">
                    <div class="form-error" style="display:none"></div>
                    <div class="form-success" style="display:none"></div>
                    <div class="form-group">
                        <label for="reset-new-password">New password</label>
                        <input id="reset-new-password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
                        <span class="field-error"></span>
                    </div>
                    <div class="form-group">
                        <label for="reset-confirm-password">Confirm new password</label>
                        <input id="reset-confirm-password" name="confirmPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
                        <span class="field-error"></span>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block"><span class="btn-text">Update password</span></button>
                </form>
            </div>
        </div>
    </template>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
